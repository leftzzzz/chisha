name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上只保留最新一次运行，旧的直接取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: type-check / lint / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # eval 用桩模型 + fixture 高德驱动真实 loop，不需要任何 API Key。
      # 它锁的是"这一轮总共搜了几步、评了几次"，单测锁不住这层。
      - name: Agent eval (behaviour regression)
        run: npm run eval
