name: 功能建议
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 先说问题，不要直接说方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 你认为它属于哪一层
      description: 见 CLAUDE.md 的分层判据；不确定就选最后一项
      options:
        - 子 Agent（需要理解自然语言或语义）
        - 编排策略（需要枚举状态做选择）
        - Runtime（需要发请求、发事件、改状态）
        - 确定性规则库（同样输入永远同样输出）
        - 前端 / 交互
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
