name: 功能建议
description: 提议一个用户可验证的新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景、当前阻碍和受影响的人，不要求判断内部实现层。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 说明完成后用户能观察或完成什么。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 给出可以判断功能完成的具体场景或条件。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供打码后的截图或示例；不要粘贴 Key、坐标、完整对话或私有 trace。
